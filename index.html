<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Minecraft Shop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Minecraft Shop</h1>
  <button id="cartBtn">🛒 <span id="cartCount">0</span></button>
</header>

<main id="products"></main>

<div id="cartModal" class="modal hidden">
  <div class="modal-content">
    <span id="closeCart" class="close">&times;</span>
    <h2>Warenkorb</h2>
    <ul id="cartItems"></ul>
    <p id="cartTotal"></p>
    <button id="checkoutBtn">Mit Diamanten bezahlen</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
